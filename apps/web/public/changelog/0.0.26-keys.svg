<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .bad { fill: #B4472E } .rule { stroke: #CFC8B9 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .bad { fill: #E08A6E } .rule { stroke: #3A3B35 }
    }
  </style>
  <rect class="bg" width="800" height="360" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">A WORKSHEET AND ITS KEY, TWO WRITERS</text>
  <rect class="card" x="36" y="64" width="350" height="262" rx="14"/>
  <text class="ink" x="56" y="96" font-size="16" font-weight="600">The worksheet: Claude Sonnet</text>
  <text class="ink2" x="56" y="124" font-size="13">Which set of sheets would you rather use?</text>
  <text class="acc" x="56" y="172" font-size="40" font-weight="700">11</text>
  <text class="ink2" x="112" y="172" font-size="14">lessons: Sonnet’s</text>
  <text class="ink" x="56" y="222" font-size="40" font-weight="700">4</text>
  <text class="ink2" x="92" y="222" font-size="14">lessons: Sol’s</text>
  <text class="ink2" x="56" y="270" font-size="13">More to do on them, better laid out.</text>
  <text class="ink2" x="56" y="290" font-size="13">But five wrong answers in their keys</text>
  <rect class="card" x="414" y="64" width="350" height="262" rx="14"/>
  <text class="ink" x="434" y="96" font-size="16" font-weight="600">Its key: GPT-6.1 Sol</text>
  <text class="ink2" x="434" y="124" font-size="13">Same sheets, two keys. Wrong answers:</text>
  <text class="bad" x="434" y="172" font-size="40" font-weight="700">4</text>
  <text class="ink2" x="470" y="172" font-size="14">Sonnet’s keys, and 6 questions unkeyed</text>
  <text class="acc" x="434" y="222" font-size="40" font-weight="700">0</text>
  <text class="ink2" x="470" y="222" font-size="14">Sol’s keys, and 1 unkeyed</text>
  <text class="ink2" x="434" y="270" font-size="13">Sol’s key preferred in 12 lessons of 16,</text>
  <text class="ink2" x="434" y="290" font-size="13">Sonnet’s in none</text>
</svg>
