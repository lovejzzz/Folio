<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .rule { stroke: #CFC8B9 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .rule { stroke: #3A3B35 }
    }
  </style>
  <rect class="bg" width="800" height="320" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">THIRTY-TWO FRESH LESSONS, READ BLIND</text>
  <rect class="card" x="36" y="64" width="728" height="226" rx="14"/>
  <text class="ink" x="470" y="100" font-size="14" font-weight="600" text-anchor="end">0.0.33</text>
  <text class="ink" x="590" y="100" font-size="14" font-weight="600" text-anchor="end">0.0.35</text>
  <text class="ink" x="720" y="100" font-size="14" font-weight="600" text-anchor="end">0.0.36</text>
  <line class="rule" x1="56" y1="124" x2="744" y2="124"/><text class="ink2" x="56" y="150" font-size="15">Faults that stop a lesson</text><text class="ink2" x="470" y="150" font-size="15" text-anchor="end">9</text><text class="ink2" x="590" y="150" font-size="15" text-anchor="end">21</text><text class="acc" x="720" y="150" font-size="16" font-weight="700" text-anchor="end">11</text>
  <line class="rule" x1="56" y1="166" x2="744" y2="166"/><text class="ink2" x="56" y="192" font-size="15">Lessons with nothing to trip over</text><text class="ink2" x="470" y="192" font-size="15" text-anchor="end">12</text><text class="ink2" x="590" y="192" font-size="15" text-anchor="end">6</text><text class="acc" x="720" y="192" font-size="16" font-weight="700" text-anchor="end">14</text>
  <line class="rule" x1="56" y1="208" x2="744" y2="208"/><text class="ink2" x="56" y="234" font-size="15">Notes from Folio: true / false</text><text class="ink2" x="470" y="234" font-size="15" text-anchor="end">5 / 5</text><text class="ink2" x="590" y="234" font-size="15" text-anchor="end">3 / 8</text><text class="acc" x="720" y="234" font-size="16" font-weight="700" text-anchor="end">6 / 2</text>
  <line class="rule" x1="56" y1="250" x2="744" y2="250"/><text class="ink2" x="56" y="276" font-size="15">Same exercise in two versions</text><text class="ink2" x="470" y="276" font-size="15" text-anchor="end">0</text><text class="ink2" x="590" y="276" font-size="15" text-anchor="end">9</text><text class="acc" x="720" y="276" font-size="16" font-weight="700" text-anchor="end">0</text>
  </svg>
