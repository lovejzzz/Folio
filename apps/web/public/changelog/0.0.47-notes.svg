<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .row { fill: #E3DED3 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .row { fill: #3A3B35 }
    }
  </style>
  <rect class="bg" width="800" height="300" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">THE SAME THREE COURSES, WRITTEN AGAIN</text>
  <rect class="card" x="36" y="64" width="728" height="200" rx="14"/>
  <text class="ink2" x="56" y="98" font-size="13">Before</text><text class="ink2" x="140" y="98" font-size="13">Now</text>
  <text class="ink" x="230" y="98" font-size="14" font-weight="600">In the teacher's notes and the materials</text>
  <rect class="row" x="56" y="116" width="64" height="16" rx="8"/><text class="ink" x="64" y="129" font-size="12" font-weight="600">8</text>
  <rect class="acc" x="140" y="116" width="16" height="16" rx="8"/><text class="ink" x="164" y="129" font-size="12" font-weight="600">0</text>
  <text class="ink" x="230" y="129" font-size="14">“Say the due date in exactly those words”: Folio's own rules</text>
  <rect class="row" x="56" y="160" width="32" height="16" rx="8"/><text class="ink" x="64" y="173" font-size="12" font-weight="600">2</text>
  <rect class="acc" x="140" y="160" width="16" height="16" rx="8"/><text class="ink" x="164" y="173" font-size="12" font-weight="600">0</text>
  <text class="ink" x="230" y="173" font-size="14">A point an answer, and a rubric of four levels beside it</text>
  <rect class="row" x="56" y="204" width="20" height="16" rx="8"/><text class="ink" x="64" y="217" font-size="12" font-weight="600">1</text>
  <rect class="acc" x="140" y="204" width="16" height="16" rx="8"/><text class="ink" x="164" y="217" font-size="12" font-weight="600">0</text>
  <text class="ink" x="230" y="217" font-size="14">A right Java answer marked wrong: 8 / 3 is 2 in Java</text>
</svg>
