<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .accl { stroke: #2B46C4 } .tint { fill: #EDF0FC } .bad { fill: #A8321F } .badt { fill: #FBEAE6 } .num { fill: #2B46C4 } .numt { fill: #FFFFFF }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .accl { stroke: #8FA3FF } .tint { fill: #23284A } .bad { fill: #F08A76 } .badt { fill: #3A2420 } .num { fill: #8FA3FF } .numt { fill: #11152E }
    }
  </style>
  <rect class="bg" width="800" height="300" rx="20"/>

  <text class="ink2" x="36" y="44" font-size="15" font-weight="600" letter-spacing="0.6">BEFORE · THREE LESSONS, THE SAME STEP</text>
  <g font-size="13">
    <rect class="badt" x="36" y="58" width="232" height="44" rx="10"/><text class="bad" x="152" y="85" text-anchor="middle">Choose a study for your summary</text>
    <rect class="badt" x="284" y="58" width="232" height="44" rx="10"/><text class="bad" x="400" y="85" text-anchor="middle">Choose a study for your summary</text>
    <rect class="badt" x="532" y="58" width="232" height="44" rx="10"/><text class="bad" x="648" y="85" text-anchor="middle">Choose a study for your summary</text>
  </g>

  <text class="acc" x="36" y="150" font-size="15" font-weight="600" letter-spacing="0.6">NOW · EACH STEP KNOWS THE ONES BEFORE IT</text>
  <g font-size="14">
    <rect class="card" x="36" y="166" width="168" height="76" rx="12"/>
    <circle class="num" cx="58" cy="190" r="11"/><text class="numt" x="58" y="194.5" text-anchor="middle" font-size="12" font-weight="700">1</text>
    <text class="ink" x="76" y="195" font-weight="600">Evidence log</text><text class="ink2" x="52" y="224" font-size="13">start collecting</text>

    <rect class="card" x="224" y="166" width="168" height="76" rx="12"/>
    <circle class="num" cx="246" cy="190" r="11"/><text class="numt" x="246" y="194.5" text-anchor="middle" font-size="12" font-weight="700">2</text>
    <text class="ink" x="264" y="195" font-weight="600">Working claim</text><text class="ink2" x="240" y="224" font-size="13">draft a position</text>

    <rect class="card" x="412" y="166" width="168" height="76" rx="12"/>
    <circle class="num" cx="434" cy="190" r="11"/><text class="numt" x="434" y="194.5" text-anchor="middle" font-size="12" font-weight="700">3</text>
    <text class="ink" x="452" y="195" font-weight="600">Connect</text><text class="ink2" x="428" y="224" font-size="13">evidence to the claim</text>

    <rect class="tint" x="600" y="166" width="164" height="76" rx="12"/>
    <text class="acc" x="682" y="199" text-anchor="middle" font-weight="600">The essay</text><text class="acc" x="682" y="221" text-anchor="middle" font-size="13">50% of the grade</text>
  </g>
  <g class="accl" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M207 204 H218"/><path d="M213 198 L220 204 L213 210"/>
    <path d="M395 204 H406"/><path d="M401 198 L408 204 L401 210"/>
    <path d="M583 204 H594"/><path d="M589 198 L596 204 L589 210"/>
  </g>
  <text class="ink2" x="400" y="274" font-size="13" text-anchor="middle">Before: an intro psychology course. Now: a grade 11 unit on Reconstruction, building to its essay.</text>
</svg>
