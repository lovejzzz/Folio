<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .bad { fill: #B4472E } .line { stroke: #2B46C4; stroke-width: 2; fill: none } .dash { stroke: #B4472E; stroke-width: 2; stroke-dasharray: 5 4; fill: none }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .bad { fill: #E08A6E } .line { stroke: #8FA3FF } .dash { stroke: #E08A6E }
    }
  </style>
  <rect class="bg" width="800" height="360" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">ONE WEEK’S QUIZ, PROBLEM SET AND RECITATION WORK</text>
  <rect class="card" x="36" y="64" width="350" height="262" rx="14"/>
  <text class="ink" x="56" y="96" font-size="16" font-weight="600">Before: each written alone</text>
  <text class="ink2" x="56" y="140" font-size="14">Practice quiz</text>
  <text class="bad" x="200" y="140" font-size="14">54 km/h in m/s</text>
  <text class="ink2" x="56" y="184" font-size="14">Recitation</text>
  <text class="bad" x="200" y="184" font-size="14">54 km/h in m/s</text>
  <text class="ink2" x="56" y="228" font-size="14">Problem set</text>
  <text class="bad" x="200" y="228" font-size="14">54 km/h in m/s</text>
  <path class="dash" d="M190 148 V214"/>
  <text class="ink2" x="56" y="284" font-size="13">The same conversion three times, once</text>
  <text class="ink2" x="56" y="304" font-size="13">graded after its solution was posted</text>
  <rect class="card" x="414" y="64" width="350" height="262" rx="14"/>
  <text class="ink" x="434" y="96" font-size="16" font-weight="600">Now: each sees the ones before</text>
  <text class="ink2" x="434" y="140" font-size="14">Practice quiz</text>
  <text class="acc" x="578" y="140" font-size="14">0.0068 m in mm</text>
  <text class="ink2" x="434" y="184" font-size="14">Recitation</text>
  <text class="acc" x="578" y="184" font-size="14">81 km/h in m/s</text>
  <text class="ink2" x="434" y="228" font-size="14">Problem set</text>
  <text class="acc" x="578" y="228" font-size="14">54 mi/h in m/s</text>
  <path class="line" d="M568 148 V214"/>
  <text class="ink2" x="434" y="284" font-size="13">Written in order: quiz, then graded work,</text>
  <text class="ink2" x="434" y="304" font-size="13">each told what is already set</text>
</svg>
