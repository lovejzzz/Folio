<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .row { fill: #E3DED3 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .row { fill: #3A3B35 }
    }
  </style>
  <rect class="bg" width="800" height="300" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">ONE SLIDE, TWO COPIES</text>
  <rect class="card" x="36" y="64" width="350" height="200" rx="14"/>
  <text class="ink" x="56" y="96" font-size="16" font-weight="600">The teacher's</text>
  <text class="ink" x="56" y="140" font-size="15">Before next time: read</text>
  <text class="ink" x="56" y="164" font-size="15">ch. 2 <tspan class="acc" font-weight="600">(to confirm)</tspan>, Atoms,</text>
  <text class="ink" x="56" y="188" font-size="15">Molecules, and Ions</text>
  <text class="ink2" x="56" y="240" font-size="13">Listed at the top of the lesson too</text>
  <rect class="card" x="414" y="64" width="350" height="200" rx="14"/>
  <text class="ink" x="434" y="96" font-size="16" font-weight="600">The students'</text>
  <text class="ink" x="434" y="140" font-size="15">Before next time: read</text>
  <text class="ink" x="434" y="164" font-size="15">ch. 2, Atoms,</text>
  <text class="ink" x="434" y="188" font-size="15">Molecules, and Ions</text>
  <text class="ink2" x="434" y="240" font-size="13">Printed, exported, and in Canvas</text>
</svg>
