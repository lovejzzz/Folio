<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .row { fill: #E3DED3 } .line { stroke: #E3DED3 } .on { fill: #FFFFFF }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .row { fill: #3A3B35 } .line { stroke: #3A3B35 } .on { fill: #1C1D19 }
    }
  </style>
  <rect class="bg" width="800" height="300" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">ONE PART OF A LESSON THAT SHOWS TWO THINGS</text>
  <rect class="card" x="36" y="64" width="350" height="200" rx="14"/>
  <text class="ink" x="56" y="96" font-size="16" font-weight="600">How this course works</text>
  <rect class="acc" x="56" y="140" width="90" height="34" rx="8"/><text x="101" y="162" font-size="13" text-anchor="middle" class="on">Draft</text>
  <rect class="acc" x="160" y="140" width="90" height="34" rx="8"/><text x="205" y="162" font-size="13" text-anchor="middle" class="on">Review</text>
  <rect class="acc" x="264" y="140" width="100" height="34" rx="8"/><text x="314" y="162" font-size="13" text-anchor="middle" class="on">Revision</text>
  <text class="ink2" x="56" y="236" font-size="13">The chain, on its slide as before</text>
  <rect class="card" x="414" y="64" width="350" height="200" rx="14"/>
  <text class="ink" x="434" y="96" font-size="16" font-weight="600">How this course works (continued)</text>
  <rect class="row" x="434" y="118" width="310" height="22" rx="4"/>
  <text class="ink" x="444" y="134" font-size="13" font-weight="600">Graded work</text><text class="ink" x="700" y="134" font-size="13" font-weight="600">Share</text>
  <text class="ink" x="444" y="160" font-size="13">Essay 1</text><text class="ink" x="700" y="160" font-size="13">15%</text>
  <text class="ink" x="444" y="182" font-size="13">Essay 2</text><text class="ink" x="700" y="182" font-size="13">20%</text>
  <text class="ink" x="444" y="204" font-size="13">…</text>
  <text class="ink2" x="434" y="236" font-size="13">The grade table, which was dropped, now follows</text>
</svg>
