<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .well { fill: #F0ECE2 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .rule { stroke: #CFC8B9 } .dot { fill: #8A857A }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .well { fill: #262722 } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .rule { stroke: #3A3B35 } .dot { fill: #8A857A }
    }
  </style>
  <rect class="bg" width="800" height="300" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">BEFORE</text>
  <text class="ink2" x="420" y="46" font-size="15" font-weight="600" letter-spacing="0.6">NOW</text>
  <line class="rule" x1="400" y1="30" x2="400" y2="270"/>
  <rect class="card" x="36" y="64" width="160" height="200" rx="12"/>
  <text class="ink" x="52" y="92" font-size="14" font-weight="600">Slide</text>
  <text class="ink2" x="52" y="124" font-size="14">1. Null or not?</text>
  <text class="ink2" x="52" y="150" font-size="14">2. Tutoring hours</text>
  <text class="ink2" x="52" y="176" font-size="14">3. Class size</text>
  <rect class="card" x="212" y="64" width="160" height="200" rx="12"/>
  <text class="ink" x="228" y="92" font-size="14" font-weight="600">Worksheet</text>
  <text class="ink2" x="228" y="124" font-size="14">1. Null or not?</text>
  <text class="acc" x="228" y="150" font-size="14">2. Sleep and grades</text>
  <text class="acc" x="228" y="176" font-size="14">3. Commute time</text>
  <rect class="card" x="428" y="64" width="160" height="200" rx="12"/>
  <text class="ink" x="444" y="92" font-size="14" font-weight="600">Slide</text>
  <text class="ink2" x="444" y="124" font-size="14">1. Null or not?</text>
  <text class="ink2" x="444" y="150" font-size="14">2. Sleep and grades</text>
  <text class="ink2" x="444" y="176" font-size="14">3. Commute time</text>
  <rect class="card" x="604" y="64" width="160" height="200" rx="12"/>
  <text class="ink" x="620" y="92" font-size="14" font-weight="600">Worksheet</text>
  <text class="ink2" x="620" y="124" font-size="14">1. Null or not?</text>
  <text class="ink2" x="620" y="150" font-size="14">2. Sleep and grades</text>
  <text class="ink2" x="620" y="176" font-size="14">3. Commute time</text>
</svg>
