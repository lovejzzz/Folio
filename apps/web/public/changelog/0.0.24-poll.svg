<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .bad { fill: #B4472E } .rule { stroke: #CFC8B9 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .bad { fill: #E08A6E } .rule { stroke: #3A3B35 }
    }
  </style>
  <rect class="bg" width="800" height="360" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">A GRADED POLL IN A MICROECONOMICS LECTURE</text>
  <rect class="card" x="36" y="64" width="350" height="262" rx="14"/>
  <text class="ink" x="56" y="96" font-size="16" font-weight="600">Before: the slide</text>
  <text class="bad" x="56" y="132" font-size="14" font-weight="600">“Clicker questions:</text>
  <text class="bad" x="56" y="152" font-size="14" font-weight="600">answer alone first”</text>
  <line class="rule" x1="56" y1="176" x2="366" y2="176"/>
  <text class="ink2" x="56" y="204" font-size="13">The six questions and their choices</text>
  <text class="ink2" x="56" y="224" font-size="13">were in the teacher’s notes only.</text>
  <text class="ink2" x="56" y="262" font-size="13">Ten percent of the grade, and</text>
  <text class="ink2" x="56" y="282" font-size="13">nothing for the class to read</text>
  <rect class="card" x="414" y="64" width="350" height="262" rx="14"/>
  <text class="ink" x="434" y="96" font-size="16" font-weight="600">Now: a slide for each question</text>
  <text class="acc" x="434" y="132" font-size="14" font-weight="600">Poll 1: a frost hits the coffee crop</text>
  <text class="ink2" x="434" y="160" font-size="13">What happens to the price of coffee?</text>
  <line class="rule" x1="434" y1="176" x2="744" y2="176"/>
  <text class="ink2" x="434" y="204" font-size="13">A. Rises</text>
  <text class="ink2" x="434" y="226" font-size="13">B. Falls</text>
  <text class="ink2" x="434" y="248" font-size="13">C. No change</text>
  <text class="ink2" x="434" y="270" font-size="13">D. Cannot tell</text>
</svg>
