<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .bad { fill: #B4472E } .soft { fill: #EDF0FC } .code { fill: #F0ECE2 } .rule { stroke: #CFC8B9 }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .bad { fill: #E08A6E } .soft { fill: #23284A } .code { fill: #2A2B26 } .rule { stroke: #3A3B35 }
    }
  </style>
  <rect class="bg" width="800" height="330" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">A CELL ON A WEEK’S PAGE, AND WHAT STANDS UNDER IT</text>
  <rect class="card" x="36" y="64" width="350" height="230" rx="14"/>
  <text class="ink" x="56" y="96" font-size="16" font-weight="600">Before</text>
  <rect class="code" x="56" y="110" width="310" height="62" rx="8"/>
  <text class="ink mono" x="70" y="134" font-size="13">mask = rain &gt;= 6</text>
  <text class="ink mono" x="70" y="156" font-size="13">print(mask.sum())</text>
  <text class="ink2" x="56" y="196" font-size="12" font-weight="600" letter-spacing="0.5">OUTPUT</text>
  <rect class="code" x="56" y="204" width="310" height="34" rx="8"/>
  <text class="bad mono" x="70" y="226" font-size="13" font-weight="600">5</text>
  <text class="ink2" x="56" y="268" font-size="13">What the writer expected the code to print.</text>
  <rect class="card" x="414" y="64" width="350" height="230" rx="14"/>
  <text class="ink" x="434" y="96" font-size="16" font-weight="600">Now</text>
  <rect class="code" x="434" y="110" width="310" height="62" rx="8"/>
  <text class="ink mono" x="448" y="134" font-size="13">mask = rain &gt;= 6</text>
  <text class="ink mono" x="448" y="156" font-size="13">print(mask.sum())</text>
  <text class="ink2" x="434" y="196" font-size="12" font-weight="600" letter-spacing="0.5">OUTPUT · RUN ON PYTHON 3.14, NUMPY 2.4</text>
  <rect class="soft" x="434" y="204" width="310" height="34" rx="8"/>
  <text class="acc mono" x="448" y="226" font-size="13" font-weight="600">6</text>
  <text class="ink2" x="434" y="268" font-size="13">What the code printed when Folio ran it.</text>
</svg>
