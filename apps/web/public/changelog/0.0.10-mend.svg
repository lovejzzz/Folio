<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .bad { fill: #B4472E } .soft { fill: #EDF0FC } .warn { fill: #FBF1DE } .rule { stroke: #CFC8B9 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .bad { fill: #E08A6E } .soft { fill: #23284A } .warn { fill: #3A2F17 } .rule { stroke: #3A3B35 }
    }
  </style>
  <rect class="bg" width="800" height="360" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">WHEN A REVIEW FINDS PROBLEMS ON A PAGE</text>
  <rect class="card" x="36" y="64" width="350" height="260" rx="14"/>
  <text class="ink" x="56" y="96" font-size="16" font-weight="600">Before: the whole page again</text>
  <g font-size="13">
    <rect class="warn" x="56" y="114" width="310" height="22" rx="5"/><text class="ink" x="66" y="130">Part 1</text>
    <rect class="warn" x="56" y="142" width="310" height="22" rx="5"/><text class="ink" x="66" y="158">Part 2</text>
    <rect class="warn" x="56" y="170" width="310" height="22" rx="5"/><text class="bad" x="66" y="186" font-weight="600">Part 3 · a problem</text>
    <rect class="warn" x="56" y="198" width="310" height="22" rx="5"/><text class="ink" x="66" y="214">Part 4</text>
    <rect class="warn" x="56" y="226" width="310" height="22" rx="5"/><text class="bad" x="66" y="242" font-weight="600">Part 5 · a problem</text>
  </g>
  <text class="ink2" x="56" y="278" font-size="13">Every part was written again, sound or not,</text>
  <text class="ink2" x="56" y="298" font-size="13">and the new page had new problems of its own.</text>
  <rect class="card" x="414" y="64" width="350" height="260" rx="14"/>
  <text class="ink" x="434" y="96" font-size="16" font-weight="600">Now: only the parts at fault</text>
  <g font-size="13">
    <rect class="soft" x="434" y="114" width="310" height="22" rx="5"/><text class="ink2" x="444" y="130">Part 1 · kept as it is</text>
    <rect class="soft" x="434" y="142" width="310" height="22" rx="5"/><text class="ink2" x="444" y="158">Part 2 · kept as it is</text>
    <rect class="warn" x="434" y="170" width="310" height="22" rx="5"/><text class="acc" x="444" y="186" font-weight="600">Part 3 · written again, read again</text>
    <rect class="soft" x="434" y="198" width="310" height="22" rx="5"/><text class="ink2" x="444" y="214">Part 4 · kept as it is</text>
    <rect class="warn" x="434" y="226" width="310" height="22" rx="5"/><text class="acc" x="444" y="242" font-weight="600">Part 5 · written again, read again</text>
  </g>
  <text class="ink2" x="434" y="278" font-size="13">Across 34 weekly pages of three courses:</text>
  <text class="acc" x="434" y="300" font-size="15" font-weight="600">259 notes at first reading, 67 left</text>
</svg>
