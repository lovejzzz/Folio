<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .bad { fill: #B4472E } .rule { stroke: #CFC8B9 } .slot { fill: #E3DED3 } .over { fill: #B4472E } .fit { fill: #2B46C4 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .bad { fill: #E08A6E } .rule { stroke: #3A3B35 } .slot { fill: #3A3B35 } .over { fill: #E08A6E } .fit { fill: #8FA3FF }
    }
  </style>
  <rect class="bg" width="800" height="360" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">A SEGMENT, COUNTED BY WHAT IT ASKS</text>
  <rect class="card" x="36" y="64" width="728" height="262" rx="14"/>
  <text class="ink2" x="56" y="98" font-size="13">Practice, 9 minutes, as first written</text>
  <text class="ink" x="56" y="122" font-size="15">Three problems with working, told to a partner and back, three answers heard.</text>
  <rect class="slot" x="56" y="140" width="270" height="14" rx="4"/>
  <rect class="over" x="56" y="140" width="390" height="14" rx="4" opacity="0.85"/>
  <text class="bad" x="460" y="152" font-size="13">6 + 4 + 3 = 13 minutes for 9</text>
  <line class="rule" x1="56" y1="184" x2="744" y2="184"/>
  <text class="ink2" x="56" y="212" font-size="13">As it reaches you</text>
  <text class="ink" x="56" y="236" font-size="15">Three problems, the working shown for one; compared with a partner, two heard.</text>
  <rect class="slot" x="56" y="254" width="270" height="14" rx="4"/>
  <rect class="fit" x="56" y="254" width="270" height="14" rx="4" opacity="0.85"/>
  <text class="acc" x="340" y="266" font-size="13">about 9 minutes for 9: every problem kept, each asking less</text>
  <text class="ink2" x="56" y="304" font-size="13">The minutes of the plan never change. Fewer than three items are never left in a practice.</text>
</svg>
