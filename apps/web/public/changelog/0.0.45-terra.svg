<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .row { fill: #E3DED3 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .row { fill: #3A3B35 }
    }
  </style>
  <rect class="bg" width="800" height="300" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">QUIZZES AND GRADED WORK, 32 UNIVERSITY LESSONS, READ BLIND</text>
  <rect class="card" x="36" y="64" width="350" height="200" rx="14"/>
  <text class="ink" x="56" y="96" font-size="16" font-weight="600">Wrong answer keys</text>
  <text class="ink2" x="56" y="134" font-size="13">Before</text>
  <rect class="row" x="120" y="122" width="200" height="16" rx="8"/><text class="ink" x="330" y="135" font-size="14" font-weight="600">4</text>
  <text class="ink2" x="56" y="174" font-size="13">Now</text>
  <rect class="acc" x="120" y="162" width="100" height="16" rx="8"/><text class="ink" x="230" y="175" font-size="14" font-weight="600">2</text>
  <text class="ink2" x="56" y="226" font-size="13">Scored 8.5 before and 8.2 now, out of 10,</text>
  <text class="ink2" x="56" y="246" font-size="13">for “hand it out and grade from it as is”</text>
  <rect class="card" x="414" y="64" width="350" height="200" rx="14"/>
  <text class="ink" x="434" y="96" font-size="16" font-weight="600">What writing them costs</text>
  <text class="ink2" x="434" y="134" font-size="13">Before</text>
  <rect class="row" x="498" y="122" width="200" height="16" rx="8"/><text class="ink" x="708" y="135" font-size="14" font-weight="600">100%</text>
  <text class="ink2" x="434" y="174" font-size="13">Now</text>
  <rect class="acc" x="498" y="162" width="82" height="16" rx="8"/><text class="ink" x="590" y="175" font-size="14" font-weight="600">41%</text>
  <text class="ink2" x="434" y="226" font-size="13">Slides, study guides, FAQ and discussions</text>
  <text class="ink2" x="434" y="246" font-size="13">stay with the model that teaches best</text>
</svg>
