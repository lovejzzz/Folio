<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .row { fill: #E3DED3 } .warn { fill: #B4452F }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .row { fill: #3A3B35 } .warn { fill: #E58A73 }
    }
  </style>
  <rect class="bg" width="800" height="300" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">TWO CHECKS, AND WHAT THEY TOLD THE TEACHER</text>
  <rect class="card" x="36" y="64" width="350" height="200" rx="14"/>
  <text class="ink" x="56" y="96" font-size="16" font-weight="600">The minutes of a segment</text>
  <text class="warn" x="56" y="130" font-size="14" font-weight="600">“Needs about 10 minutes and has 6”</text>
  <text class="ink2" x="56" y="154" font-size="13">The plan’s own notes: a minute a candidate,</text>
  <text class="ink2" x="56" y="172" font-size="13">two to hear pairs. Five.</text>
  <text class="acc" x="56" y="212" font-size="14" font-weight="600">Now the plan’s own minutes count,</text>
  <text class="acc" x="56" y="232" font-size="14" font-weight="600">and the note is for what does not add up</text>
  <rect class="card" x="414" y="64" width="350" height="200" rx="14"/>
  <text class="ink" x="434" y="96" font-size="16" font-weight="600">A key worked out by a program</text>
  <text class="warn" x="434" y="130" font-size="14" font-weight="600">“Impact speed 20.3 m/s”: 20.0, unchecked</text>
  <text class="ink2" x="434" y="154" font-size="13">The program’s form ran past its time</text>
  <text class="ink2" x="434" y="172" font-size="13">and nobody was told</text>
  <text class="acc" x="434" y="212" font-size="14" font-weight="600">Now a form that could not run is written</text>
  <text class="acc" x="434" y="232" font-size="14" font-weight="600">again, told why, and never counts as a pass</text>
</svg>
