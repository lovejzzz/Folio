<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #F6F3EC } .card { fill: #FCFBF7; stroke: #E3DED3 } .ink { fill: #1E1C17 } .ink2 { fill: #5C584F }
    .acc { fill: #2B46C4 } .row { fill: #E3DED3 } .warn { fill: #B4452F } .slide { fill: #EDE9DF; stroke: #D6D0C3 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #22231F } .card { fill: #1C1D19; stroke: #2E2F2A } .ink { fill: #ECE8DF } .ink2 { fill: #B3AEA3 }
      .acc { fill: #8FA3FF } .row { fill: #3A3B35 } .warn { fill: #E58A73 } .slide { fill: #2A2B26; stroke: #3A3B35 }
    }
  </style>
  <rect class="bg" width="800" height="300" rx="20"/>
  <text class="ink2" x="36" y="46" font-size="15" font-weight="600" letter-spacing="0.6">THE SCREEN DURING A STUDENT-LED DISCUSSION</text>
  <rect class="card" x="36" y="64" width="350" height="200" rx="14"/>
  <text class="warn" x="56" y="92" font-size="13" font-weight="600" letter-spacing="0.4">BEFORE</text>
  <rect class="slide" x="56" y="104" width="310" height="104" rx="8"/>
  <text class="ink" x="70" y="126" font-size="12" font-weight="600">Seminar leadership: discussion questions</text>
  <text class="ink2" x="70" y="146" font-size="11">Q1. Where does theory sit in a quantitative proposal…?</text>
  <text class="ink2" x="70" y="162" font-size="11">Q2. What does a researcher risk by choosing a theory…?</text>
  <text class="ink2" x="70" y="178" font-size="11">Q3. Take the question: how is absence related to…?</text>
  <text class="ink2" x="70" y="194" font-size="11">Q4. How would adding a theory change later design…?</text>
  <text class="warn" x="56" y="232" font-size="12">“Keep this slide up while the leader runs the discussion.”</text>
  <text class="ink2" x="56" y="250" font-size="12">The same notes: “suggest no questions to the leader.”</text>
  <rect class="card" x="414" y="64" width="350" height="200" rx="14"/>
  <text class="acc" x="434" y="92" font-size="13" font-weight="600" letter-spacing="0.4">NOW</text>
  <rect class="slide" x="434" y="104" width="310" height="104" rx="8"/>
  <text class="ink" x="448" y="126" font-size="12" font-weight="600">Seminar leadership</text>
  <text class="ink2" x="448" y="150" font-size="12">Creswell and Creswell, Research Design, ch. 3:</text>
  <text class="ink2" x="448" y="168" font-size="12">the use of theory</text>
  <text class="acc" x="448" y="196" font-size="12" font-weight="600">The leader's questions are the leader's own.</text>
  <text class="ink2" x="434" y="232" font-size="12">A plan that lists them is asked for again;</text>
  <text class="ink2" x="434" y="250" font-size="12">no sheet of questions is printed for the turn.</text>
</svg>
