<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Folio turns a paragraph about what you want to teach into a course of linked, editable materials." />
    <meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141512" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Folio" />
    <meta property="og:url" content="https://folio.university/" />
    <meta property="og:title" content="Folio: your course, bound together" />
    <meta property="og:description" content="Describe a course in a sentence or two. Folio writes the lesson plans, slides, quizzes and more, linked and ready to edit." />
    <meta property="og:image" content="https://folio.university/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Folio. What do you want to teach? A lesson sheet with colored tabs for each material." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Folio</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('folio.prefs') || '{}').state;
        if (t && t.theme && t.theme !== 'system') document.documentElement.dataset.theme = t.theme;
      } catch (e) {}
      // Folio needs Safari 16.4, Chrome 111 or Firefox 128 or newer. Older browsers can't parse its code and
      // would show a blank page, so say so instead.
      (function () {
        var ok = true;
        try {
          new RegExp('(?<=a)b');
          ok = !!(window.CSS && CSS.supports('color', 'color-mix(in srgb, red, blue)'));
        } catch (e) {
          ok = false;
        }
        if (ok) return;
        document.addEventListener('DOMContentLoaded', function () {
          var box = document.createElement('div');
          box.style.cssText = 'max-width:34rem;margin:20vh auto;padding:0 1.5rem;font:17px/1.6 system-ui,sans-serif;color:#1E1C17';
          var h = document.createElement('h1');
          h.style.cssText = 'font-size:1.6rem;margin:0 0 .6rem';
          h.textContent = 'Please update your browser';
          var p = document.createElement('p');
          p.textContent = 'Folio needs a recent browser: Safari 16.4, Chrome 111, Edge 111 or Firefox 128, or newer.';
          box.appendChild(h);
          box.appendChild(p);
          document.body.replaceChildren(box);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
